name: PASAT CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.3'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install release tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip ripgrep

      - name: Check shell script syntax
        run: |
          bash -n tools/build-release.sh
          bash -n tools/check-release.sh
          bash -n tools/smoke-zip-install.sh

      - name: Run PASAT release preflight
        run: tools/check-release.sh

      - name: Verify release checksum
        run: cd dist && sha256sum -c pasat-*.zip.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pasat-release-php-${{ matrix.php }}
          path: |
            dist/pasat-*.zip
            dist/pasat-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  zip-install-smoke:
    name: ZIP Install Smoke
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install release tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Show Docker version
        run: docker version

      - name: Run ZIP install smoke test
        run: tools/smoke-zip-install.sh
